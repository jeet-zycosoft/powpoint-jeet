        updateFailed: Échec de la mise à jour du profil.
        saveError: Une erreur s'est produite lors de l'enregistrement du profil.
        profilePhotoDeleted: Photo de profil supprimée avec succès.
        profilePhotoDeleteFailed: Échec de la suppression de la photo de profil.
        profilePhotoDeleteError: Une erreur s'est produite lors de la suppression de la photo de profil.
        galleryPhotoDeleted: Photo de galerie supprimée avec succès.
        galleryPhotoDeleteFailed: Échec de la suppression de la photo de galerie.
        galleryPhotoDeleteError: Une erreur s'est produite lors de la suppression de la photo de galerie.
