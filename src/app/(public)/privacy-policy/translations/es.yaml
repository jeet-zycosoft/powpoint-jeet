privacy:
  title: "Política de Privacidad"
  lastUpdated: "Última actualización: 18 de junio de 2026"
  intro: "En PawPoint, valoramos la confianza que deposita en nosotros al compartir su información personal. Esta Política de Privacidad describe cómo recopilamos, usamos, procesamos y divulgamos su información, incluida la información personal, en relación con su acceso y uso de la plataforma PawPoint."
  sections:
    sec1_title: "1. Información que Recopilamos"
    sec1_desc: "Recopilamos información para brindar mejores servicios a todos nuestros usuarios. Los tipos de información que recopilamos incluyen:"
    sec1_account_label: "Información de la Cuenta:"
    sec1_account_text: "Cuando se registra para obtener una cuenta, solicitamos cierta información como su nombre, dirección de correo electrónico, número de teléfono y contraseña."
    sec1_profile_label: "Información de Perfil y Cuidador:"
    sec1_profile_text: "Dependiendo de su rol (Dueño o Cuidador de mascotas), recopilamos detalles adicionales como servicios ofrecidos, tarifas por hora, detalles de las mascotas, antecedentes y ubicación (dirección, ciudad, país y coordenadas)."
    sec1_comm_label: "Comunicaciones:"
    sec1_comm_text: "Cuando se comunica con PawPoint o con otros usuarios a través del sistema de chat y mensajería de nuestra plataforma, recopilamos información sobre su comunicación."
    sec2_title: "2. Cómo Usamos su Información"
    sec2_desc: "Usamos, almacenamos y procesamos su información para proporcionar, comprender, mejorar y desarrollar la plataforma PawPoint, crear y mantener un entorno confiable y seguro, y cumplir con nuestras obligaciones legales. Esto incluye:"
    sec2_item1: "Facilitar conexiones y reservas entre dueños y cuidadores de mascotas."
    sec2_item2: "Brindar soporte, atención al cliente y resolver disputas."
    sec2_item3: "Procesar pagos y suscripciones de forma segura a través de nuestras pasarelas de pago."
    sec2_item4: "Enviar actualizaciones del servicio, alertas y mensajes promocionales."
    sec3_title: "3. Compartir y Divulgar Información"
    sec3_desc: "No vendemos, alquilamos ni comercializamos su información personal a terceros. Solo compartimos información en las siguientes circunstancias:"
    sec3_sharing_label: "Entre Dueños y Cuidadores:"
    sec3_sharing_text: "Para facilitar las solicitudes de conexión y reserva, se comparte información de perfil relevante, coordenadas/radio general, reseñas y mensajes con la otra parte."
    sec3_providers_label: "Proveedores de Servicios:"
    sec3_providers_text: "Compartimos información con procesadores de pagos (como Stripe o Razorpay) y servidores de bases de datos para facilitar el funcionamiento de la plataforma."
    sec3_legal_label: "Cumplimiento Legal:"
    sec3_legal_text: "Podemos divulgar información si así lo exige la ley, un reglamento o un proceso legal."
    sec4_title: "4. Seguridad de los Datos"
    sec4_content: "Implementamos medidas técnicas y organizativas adecuadas para proteger su información personal contra el acceso no autorizado, pérdida, alteración o divulgación. Sin embargo, tenga en cuenta que ninguna transmisión por Internet es 100% segura y no podemos garantizar una seguridad absoluta."
    sec5_title: "5. Sus Derechos y Opciones"
    sec5_content: "Usted tiene control sobre sus datos personales. Puede acceder y actualizar los detalles de su cuenta directamente a través de su página de perfil. También puede solicitar la eliminación de su cuenta o restringir ciertas actividades de procesamiento contactando a nuestro equipo de soporte."
    sec6_title: "6. Contáctenos"
    sec6_content: "Si tiene alguna pregunta o queja sobre esta Política de Privacidad o las prácticas de manejo de información de PawPoint, comuníquese con nosotros a través de nuestra página de contacto o envíenos un correo electrónico a support@pawpoint.com."
