privacy:
  title: "Privacy & Policy"
  lastUpdated: "Last Updated: June 18, 2026"
  intro: "At PawPoint, we value the trust you place in us when sharing your personal information. This Privacy Policy describes how we collect, use, process, and disclose your information, including personal information, in conjunction with your access to and use of the PawPoint platform."
  sections:
    sec1_title: "1. Information We Collect"
    sec1_desc: "We collect information to provide better services to all our users. The types of information we collect include:"
    sec1_account_label: "Account Information:"
    sec1_account_text: "When you sign up for an account, we require certain information such as your name, email address, phone number, and password."
    sec1_profile_label: "Profile & Sitter Information:"
    sec1_profile_text: "Depending on your role (Pet Owner or Pet Sitter), we collect additional details such as services offered, hourly rates, pet details, background details, and location information (address, city, country, and coordinates)."
    sec1_comm_label: "Communications:"
    sec1_comm_text: "When you communicate with PawPoint or other users (owners/sitters) through our platform's chat and messaging system, we collect information about your communication."
    sec2_title: "2. How We Use Your Information"
    sec2_desc: "We use, store, and process your information to provide, understand, improve, and develop the PawPoint platform, create and maintain a trusted and safe environment, and comply with our legal obligations. This includes:"
    sec2_item1: "Facilitating connections and bookings between Pet Owners and Pet Sitters."
    sec2_item2: "Providing support, customer care, and resolving disputes."
    sec2_item3: "Processing payments and subscriptions securely via our payment gateways."
    sec2_item4: "Sending service updates, alerts, and promotional messages."
    sec3_title: "3. Information Sharing & Disclosure"
    sec3_desc: "We do not sell, rent, or trade your personal information to third parties. We share information only in the following circumstances:"
    sec3_sharing_label: "Between Owners and Sitters:"
    sec3_sharing_text: "To facilitate connection and booking requests, relevant profile info, general coordinates/radius, reviews, and messages are shared with the other party."
    sec3_providers_label: "Service Providers:"
    sec3_providers_text: "We share information with payment processors (such as Stripe or Razorpay) and database hosts to facilitate platform operations."
    sec3_legal_label: "Legal Compliance:"
    sec3_legal_text: "We may disclose information if required by law, regulation, or legal process."
    sec4_title: "4. Data Security"
    sec4_content: "We implement appropriate technical and organizational measures to protect your personal information against unauthorized access, loss, alteration, or disclosure. However, please note that no internet transmission is 100% secure, and we cannot guarantee absolute security."
    sec5_title: "5. Your Rights & Choices"
    sec5_content: "You have control over your personal data. You can access and update your account details directly through your profile page. You may also request deletion of your account or restrict certain processing activities by contacting our support team."
    sec6_title: "6. Contact Us"
    sec6_content: "If you have any questions or complaints about this Privacy Policy or PawPoint's information handling practices, please reach out to us through our contact page or email us at support@pawpoint.com."
