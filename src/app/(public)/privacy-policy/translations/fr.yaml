privacy:
  title: "Politique de Confidentialité"
  lastUpdated: "Dernière mise à jour : 18 juin 2026"
  intro: "Chez PawPoint, nous accordons une grande importance à la confiance que vous nous accordez en partageant vos informations personnelles. Cette Politique de Confidentialité décrit la manière dont nous collectons, utilisons, traitons et divulguons vos informations, y compris vos données personnelles, en relation avec votre accès et votre utilisation de la plateforme PawPoint."
  sections:
    sec1_title: "1. Informations que Nous Collectons"
    sec1_desc: "Nous collectons des informations pour fournir de meilleurs services à tous nos utilisateurs. Les types d'informations collectées comprennent :"
    sec1_account_label: "Informations sur le Compte :"
    sec1_account_text: "Lorsque vous créez un compte, nous requérons certaines informations telles que votre nom, votre adresse e-mail, votre numéro de téléphone et votre mot de passe."
    sec1_profile_label: "Informations de Profil et de Gardien :"
    sec1_profile_text: "Selon votre rôle (Propriétaire ou Gardien d'animaux), nous collectons des détails supplémentaires tels que les services offerts, les tarifs horaires, les détails des animaux, les antécédents et les coordonnées de localisation (adresse, ville, pays et coordonnées géographiques)."
    sec1_comm_label: "Communications :"
    sec1_comm_text: "Lorsque vous communiquez avec PawPoint ou d'autres utilisateurs via notre système de messagerie et de chat, nous collectons des informations relatives à vos échanges."
    sec2_title: "2. Comment Nous Utilisons Vos Informations"
    sec2_desc: "Nous utilisons, stockons et traitons vos informations pour fournir, comprendre, améliorer et développer la plateforme PawPoint, créer et maintenir un environnement sûr et de confiance, et nous conformer à nos obligations légales. Cela comprend :"
    sec2_item1: "Faciliter les mises en relation et les réservations entre propriétaires et gardiens d'animaux."
    sec2_item2: "Fournir une assistance client et résoudre les litiges."
    sec2_item3: "Traiter les paiements et abonnements en toute sécurité via nos passerelles de paiement."
    sec2_item4: "Envoyer des notifications de service, des alertes et des messages promotionnels."
    sec3_title: "3. Partage et Divulgation des Informations"
    sec3_desc: "Nous ne vendons, ne louons ni n'échangeons vos informations personnelles à des tiers. Nous partageons les informations uniquement dans les cas suivants :"
    sec3_sharing_label: "Entre Propriétaires et Gardiens :"
    sec3_sharing_text: "Pour faciliter les demandes de mise en relation et de réservation, les informations de profil pertinentes, le rayon/coordonnées générales, les avis et les messages sont partagés avec l'autre partie."
    sec3_providers_label: "Prestataires de Services :"
    sec3_providers_text: "Nous partageons des informations avec les processeurs de paiement (comme Stripe ou Razorpay) et les hébergeurs de bases de données pour assurer le fonctionnement de la plateforme."
    sec3_legal_label: "Conformité Légale :"
    sec3_legal_text: "Nous pouvons divulguer des informations si la loi, la réglementation ou une procédure judiciaire l'exige."
    sec4_title: "4. Sécurité des Données"
    sec4_content: "Nous mettons en œuvre des mesures techniques et organisationnelles appropriées pour protéger vos informations personnelles contre tout accès non autorisé, perte, altération ou divulgation. Toutefois, veuillez noter qu'aucune transmission sur Internet n'est sûre à 100 % et nous ne pouvons garantir une sécurité absolue."
    sec5_title: "5. Vos Droits et Choix"
    sec5_content: "Vous disposez d'un contrôle sur vos données personnelles. Vous pouvez accéder à vos informations et les mettre à jour directement depuis votre page de profil. Vous pouvez également demander la suppression de votre compte ou limiter certaines activités de traitement en contactant notre équipe d'assistance."
    sec6_title: "6. Nous Contacter"
    sec6_content: "Si vous avez des questions ou des réclamations concernant cette Politique de Confidentialité ou les pratiques de traitement de l'information de PawPoint, veuillez nous contacter via notre page de contact ou par e-mail à support@pawpoint.com."
