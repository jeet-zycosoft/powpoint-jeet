terms:
    title: 'Términos y Condiciones'
    subtitle: 'Por favor, lea estos términos y condiciones detenidamente antes de utilizar nuestra plataforma.'
    lastUpdated: 'Última actualización: 21 de junio de 2026'
    sections:
        sec1_title: '1. Aceptación de los Términos'
        sec1_content: 'Al acceder o utilizar PawPoint, usted acepta estar sujeto a estos Términos y Condiciones y a nuestra Política de Privacidad. Si no está de acuerdo con todos estos términos, no debe acceder ni utilizar nuestros servicios.'
        sec2_title: '2. Cuentas de Usuario y Seguridad'
        sec2_content: 'Para acceder a ciertas funciones de la plataforma, debe registrarse para obtener una cuenta. Usted acepta proporcionar información precisa, actualizada y completa y mantener la seguridad de las credenciales de su cuenta. Usted es totalmente responsable de todas las actividades que ocurran bajo su cuenta.'
        sec3_title: '3. Servicios de la Plataforma y Reservas'
        sec3_content: 'PawPoint actúa como un lugar para conectar a los dueños de mascotas y a los cuidadores de mascotas. No empleamos ni respaldamos a ningún cuidador. Si bien evaluamos a los cuidadores, los dueños de mascotas son responsables de evaluar y seleccionar a los cuidadores. Cualquier reserva realizada es un contrato directo entre el dueño y el cuidador.'
        sec4_title: '4. Tarifas, Pagos y Suscripciones'
        sec4_content: 'Ciertos servicios (por ejemplo, Active Premium) requieren suscripciones pagas o tarifas de transacción. Todos los pagos se procesan a través de procesadores de terceros seguros. Las suscripciones a Active Premium se renuevan automáticamente a menos que se cancelen antes de la fecha de renovación en la configuración de su perfil.'
        sec5_title: '5. Conducta del Usuario y Seguridad'
        sec5_content: 'Los usuarios deben interactuar con respeto y honestidad. Cualquier negligencia, abuso de animales, acoso de usuarios o actividad fraudulenta está estrictamente prohibida y conducirá a la cancelación inmediata de la cuenta, la prohibición de la plataforma y posibles acciones legales.'
        sec6_title: '6. Limitación de Responsabilidad'
        sec6_content: 'En la medida máxima permitida por la ley, PawPoint no será responsable de ningún daño directo, indirecto, incidental, especial o consecuente que surja de o en conexión con su uso de la plataforma, incluidos daños a mascotas, daños a la propiedad o disputas entre usuarios.'
        sec7_title: '7. Ley Aplicable y Resolución de Disputas'
        sec7_content: 'Estos términos se regirán e interpretarán de acuerdo con las leyes de la jurisdicción en la que opera PawPoint. Cualquier disputa que surja de estos términos estará sujeta a la jurisdicción exclusiva de los tribunales de esa región.'
        sec8_title: '8. Información de Contacto'
        sec8_content: 'Si tiene alguna pregunta o comentario sobre estos Términos y Condiciones, comuníquese con nosotros a terms@pawpoint.com o a través de nuestra página de contacto.'
