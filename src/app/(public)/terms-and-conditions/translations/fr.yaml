terms:
    title: 'Conditions Générales d’Utilisation'
    subtitle: 'Veuillez lire attentivement ces conditions d’utilisation avant d’utiliser notre plateforme.'
    lastUpdated: 'Dernière mise à jour : 21 juin 2026'
    sections:
        sec1_title: '1. Acceptation des Conditions'
        sec1_content: 'En accédant à PawPoint ou en l’utilisant, vous acceptez d’être lié par ces Conditions Générales d’Utilisation et notre Politique de Confidentialité. Si vous n’acceptez pas toutes ces conditions, vous ne devez pas accéder à nos services ni les utiliser.'
        sec2_title: '2. Comptes d’Utilisateur & Sécurité'
        sec2_content: 'Pour accéder à certaines fonctionnalités de la plateforme, vous devez vous inscrire et créer un compte. Vous acceptez de fournir des informations exactes, à jour et complètes, et de maintenir la sécurité de vos identifiants de connexion. Vous êtes entièrement responsable de toutes les activités qui se déroulent sous votre compte.'
        sec3_title: '3. Services de la Plateforme & Réservations'
        sec3_content: 'PawPoint agit en tant qu’intermédiaire pour mettre en relation les propriétaires d’animaux et les gardiens. Nous n’employons ni ne cautionnons aucun gardien. Bien que nous sélectionnions les gardiens, les propriétaires d’animaux sont responsables de l’évaluation et du choix des gardiens. Toute réservation effectuée constitue un contrat direct entre le propriétaire et le gardien.'
        sec4_title: '4. Frais, Paiements & Abonnements'
        sec4_content: 'Certains services (ex. Active Premium) nécessitent des abonnements payants ou des frais de transaction. Tous les paiements sont traités par des processeurs tiers sécurisés. Les abonnements Active Premium se renouvellent automatiquement, sauf annulation avant la date de renouvellement dans les paramètres de votre profil.'
        sec5_title: '5. Conduite des Utilisateurs & Sécurité'
        sec5_content: 'Les utilisateurs doivent interagir avec respect et honnêteté. Tout acte de négligence, de maltraitance envers les animaux, de harcèlement des utilisateurs ou d’activité frauduleuse est strictement interdit et entraînera la résiliation immédiate du compte, l’exclusion de la plateforme et d’éventuelles poursuites judiciaires.'
        sec6_title: '6. Limitation de Responsabilité'
        sec6_content: 'Dans la mesure maximale permise par la loi, PawPoint ne saurait être tenu responsable des dommages directs, indirects, accessoires, spéciaux ou consécutifs découlant de ou liés à votre utilisation de la plateforme, y compris les blessures infligées aux animaux, les dommages matériels ou les litiges entre utilisateurs.'
        sec7_title: '7. Droit Applicable & Règlement des Litiges'
        sec7_content: 'Les présentes conditions sont régies et interprétées conformément aux lois de la juridiction dans laquelle PawPoint opère. Tout litige découlant de ces conditions sera soumis à la juridiction exclusive des tribunaux de cette région.'
        sec8_title: '8. Informations de Contact'
        sec8_content: 'Si vous avez des questions ou des commentaires concernant ces Conditions Générales, veuillez nous contacter à terms@pawpoint.com ou via notre page de contact.'
