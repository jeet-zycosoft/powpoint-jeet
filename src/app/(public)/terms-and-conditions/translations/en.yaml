        sec3_content: 'PawPoint acts as a venue to connect Pet Owners and Pet Sitters. We do not employ or endorse any sitters. While we vet sitters, pet owners are responsible for evaluating and selecting sitters. Any booking made is a direct contract between the owner and the sitter.'
        sec4_title: '4. Fees, Payments & Subscriptions'
        sec4_content: 'Certain services (e.g. Active Premium) require paid subscriptions or transaction fees. All payments are processed through secure third-party processors. Active Premium subscriptions auto-renew unless cancelled prior to the renewal date in your profile settings.'
